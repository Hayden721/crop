server {
    listen 80;
    server_name _;

    # React Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Spring Boot
    location /api/ {
        proxy_pass http://spring:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FastAPI
    location /fastapi/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

